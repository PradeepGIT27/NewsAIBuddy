name: Android CI/CD Pipeline (Master Release)

on:
  push:
    branches:
      - master # Trigger ONLY when code is merged or pushed to master
  workflow_dispatch:
    inputs:
      release_to_play_store:
        description: 'Deploy to Google Play Internal Testing track'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================
  # JOB 1: Continuous Integration (Lint, Unit Tests, Debug APK)
  # ==========================================================
  ci-build-and-test:
    name: 🧪 CI - Lint, Test & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Configure Gradle & Dependency Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: 🔍 Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 📦 Assemble Debug APK
        env:
          BOT_KEY: ${{ secrets.BOT_KEY }}
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
        run: ./gradlew assembleDebug --stacktrace

      - name: ⬆️ Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: 🚨 Upload Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/

  # ==========================================================
  # JOB 2: Continuous Delivery (Signed Release AAB & Play Store)
  # ==========================================================
  cd-release-playstore:
    name: 🚀 CD - Release to Play Store (Internal Testing)
    needs: ci-build-and-test
    if: |
      always() && 
      needs.ci-build-and-test.result == 'success' && 
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
        (github.event_name == 'workflow_dispatch' && inputs.release_to_play_store == true)
      )
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Configure Gradle & Dependency Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: 🔢 Calculate Version Code & Version Name
        id: versioning
        run: |
          BASE_VERSION_CODE=7
          NEXT_VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          PATCH_VERSION=$((3 + GITHUB_RUN_NUMBER))
          NEXT_VERSION_NAME="1.0.${PATCH_VERSION}"

          echo "VERSION_CODE=${NEXT_VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${NEXT_VERSION_NAME}" >> $GITHUB_ENV

          echo "Calculated Version Code: ${NEXT_VERSION_CODE}"
          echo "Calculated Version Name: ${NEXT_VERSION_NAME}"

      - name: 🔓 Decode Keystore from GitHub Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/app/release.jks

      - name: 🏗️ Build Signed Release Android App Bundle (AAB)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/app/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          BOT_KEY: ${{ secrets.BOT_KEY }}
          NEWS_KEY: ${{ secrets.NEWS_KEY }}
        run: ./gradlew bundleRelease --stacktrace

      - name: ⬆️ Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-v${{ env.VERSION_CODE }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: 📲 Deploy AAB to Google Play Store Internal Track
        uses: rstudio/play-store-upload@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.support.tech.newsaibuddy
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: 🧹 Clean up decoded Keystore & Secrets
        if: always()
        run: |
          rm -f ${{ github.workspace }}/app/release.jks
